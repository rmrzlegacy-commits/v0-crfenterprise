<!doctype html>
<html lang="en" class="scroll-smooth">

    <meta charset="UTF-8" />

    <!-- Primary SEO -->

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">

      "foundingLocation": {
        "@type": "Place",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Las Vegas",
          "addressRegion": "NV",
          "addressCountry": "US"
        }
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+17023563226",
        "contactType": "customer service",
        "email": "admin@crfenterprise.com",
        "areaServed": "US",
        "availableLanguage": "English"
      },
      "sameAs": [],
      "knowsAbout": [
        "Enterprise Technology",
        "Government Contracting",
        "Infrastructure Development",
        "Digital Transformation",
        "Cybersecurity",

    <!-- Structured Data: LocalBusiness -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",

      "name": "CRF Enterprise",
      "image": "https://www.crfenterprise.com/og-image.jpg",

      "priceRange": "$$$",
      "openingHours": "Mo-Fr 09:00-18:00"

    </script>

    <!-- Structured Data: WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "CRF Enterprise",
      "url": "https://www.crfenterprise.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://www.crfenterprise.com/?s={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Fonts: Inter (body) + Sora (headings) — both from same request -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Sora:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
